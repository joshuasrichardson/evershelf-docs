<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head-seo.html" . }}
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
    }
    a { color: #16a34a; }

    /* Nav */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #166534;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-brand {
      color: #fff;
      font-weight: 700;
      font-size: 1.125rem;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 1.25rem; align-items: center; }
    .nav-links a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .nav-links a:hover { color: #fff; }
    .nav-cta {
      background: rgba(255,255,255,0.15) !important;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 0.35rem 1rem !important;
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid #e2e8f0;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      text-align: center;
      font-size: 0.8125rem;
      color: #94a3b8;
    }
    .footer-links { margin-bottom: 0.5rem; }
    .footer-links a {
      color: #64748b;
      text-decoration: none;
      margin: 0 0.75rem;
    }
    .footer-links a:hover { color: #16a34a; }

    /* Blog CTA */
    .blog-cta {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin: 2rem 0;
      font-size: 0.9375rem;
      color: #14532d;
    }
    .blog-cta a { color: #166534; font-weight: 600; }

    {{ block "styles" . }}{{ end }}
  </style>
</head>
<body>
  {{ partial "nav.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
